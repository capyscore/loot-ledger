name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.release.tag_name || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test tracking
        run: .\Tests\Test-Tracking.ps1

      - name: Test shortcuts and tray UI
        run: .\Tests\Test-TrayUi.ps1

      - name: Test counter resets
        run: .\Tests\Test-Counter.ps1

      - name: Build executable, installer, and ZIP
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '0.0.0' }}
        run: .\Build\Build.ps1 -Version $env:BUILD_VERSION

      - name: Test packaged executable
        run: .\Tests\Test-Package.ps1

      - name: Test installer and uninstall
        run: .\Tests\Test-Installer.ps1

      - name: Upload Windows download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LootLedger-win-x64
          path: |
            dist/LootLedger.exe
            dist/LootLedger-Setup.exe
            dist/LootLedger-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach release downloads
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LootLedger-win-x64
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(dist/LootLedger.exe dist/LootLedger-Setup.exe dist/LootLedger-win-x64.zip dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            options=(--verify-tag --generate-notes --title "Loot Ledger $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
          fi
